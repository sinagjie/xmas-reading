<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 聖誕精靈出任務</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      display: flex;
      flex-direction: column;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #12365a;
      background-color: #0b2948;
      background-image:
        radial-gradient(circle at 12% 14%, rgba(255,255,255,0.9) 2px, transparent 2.5px),
        radial-gradient(circle at 82% 10%, rgba(255,255,255,0.85) 2.5px, transparent 3px),
        radial-gradient(circle at 88% 32%, rgba(255,255,255,0.75) 1.8px, transparent 2.2px),
        radial-gradient(circle at 22% 46%, rgba(255,255,255,0.7) 1.8px, transparent 2.5px),
        radial-gradient(circle at 76% 58%, rgba(255,255,255,0.8) 2px, transparent 2.5px),
        radial-gradient(circle at 18% 72%, rgba(255,255,255,0.65) 1.5px, transparent 2px),
        linear-gradient(180deg, #0b2948 0%, #14426e 65%, #1d5385 100%);
      overflow-x: hidden;
      position: relative;
    }
    .snowflake {
      position: fixed;
      top: -24px;
      color: rgba(255, 255, 255, 0.9);
      pointer-events: none;
      z-index: 0;
      animation: snowfall linear infinite;
    }
    @keyframes snowfall {
      0% { transform: translateY(-24px) translateX(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.95; }
      85% { opacity: 0.9; }
      100% { transform: translateY(105vh) translateX(24px) rotate(180deg); opacity: 0; }
    }
    .wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px 24px;
    }
    header { text-align: center; color: #fff; margin-bottom: 24px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); color: #ffe28a; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 99px; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 28px; font-weight: 900; }
    .sub { margin: 8px 0 0; font-size: 14px; color: #dceeff; }
    .sub strong { color: #f4b942; }
    .card { background: #fff; border-radius: 24px; border: 3px solid #e4edf7; box-shadow: 0 12px 28px rgba(5,18,36,0.32); padding: 22px; margin-bottom: 18px; }
    .search-row { display: flex; gap: 10px; margin-top: 14px; }
    input { flex: 1; padding: 13px; border-radius: 14px; border: 2px solid #b9d2eb; background: #f4f9fe; font-size: 17px; font-weight: bold; text-transform: uppercase; text-align: center; color: #12365a; outline: none; }
    input:focus { background: #fff; border-color: #2d7a5f; }
    button { padding: 13px 22px; border: none; border-radius: 14px; background: #d94848; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #b83535; }
    button:disabled { opacity: 0.65; cursor: not-allowed; }
    .hidden { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 2px dashed #e2e8f0; padding-bottom: 14px; margin-bottom: 16px; }
    .pill { padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; }
    .wait { background: #fff4d6; color: #8a5a00; }
    .ready { background: #dcfce7; color: #166534; }
    .claimed { background: #f1f5f9; color: #475569; }
    .prog-box { background: #eef6fd; border-radius: 16px; padding: 14px; margin-bottom: 16px; }
    .track { width: 100%; height: 14px; background: #fff; border-radius: 99px; overflow: hidden; border: 2px solid #c5dff6; margin-top: 8px; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #d94848, #f4b942, #2d7a5f); transition: width 0.4s; }
    .task { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 2px solid #e2e8f0; background: #f8fafc; margin-bottom: 10px; opacity: 0.6; }
    .task.done { background: #eefaf3; border-color: #86efac; opacity: 1; }
    .icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: #e2e8f0; flex-shrink: 0; }
    .task.done .icon { background: #2d7a5f; color: #fff; }
    .sync-hint { font-size: 12px; color: #5c7085; text-align: center; margin-top: 8px; }
    .snow-scene { position: relative; z-index: 1; width: 100%; margin-top: auto; line-height: 0; pointer-events: none; }
    .snow-scene svg { width: 100%; height: auto; display: block; }
    @media (max-width: 500px) { .search-row { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="snowflake" style="left: 10%; font-size: 15px; animation-duration: 9s; animation-delay: 0s;">❄</div>
  <div class="snowflake" style="left: 25%; font-size: 12px; animation-duration: 12s; animation-delay: -3s;">✦</div>
  <div class="snowflake" style="left: 44%; font-size: 16px; animation-duration: 10s; animation-delay: -6s;">❄</div>
  <div class="snowflake" style="left: 66%; font-size: 13px; animation-duration: 11s; animation-delay: -2s;">❅</div>
  <div class="snowflake" style="left: 83%; font-size: 15px; animation-duration: 13s; animation-delay: -7s;">❄</div>
  <div class="snowflake" style="left: 93%; font-size: 12px; animation-duration: 8.5s; animation-delay: -4s;">✦</div>

  <div class="wrap">
    <header>
      <div class="badge">🎄 圖書館冬日故事集章卡 🎁</div>
      <h1>聖誕精靈出任務</h1>
      <p class="sub">共 5 個任務，完成其中 <strong>4 個任務</strong>，就能找老師兌換造型氣球喔！🎈</p>
    </header>

    <div class="card" style="text-align: center;">
      <h2 style="margin: 0 0 6px; font-size: 19px;">🔢 輸入卡片編號查詢進度</h2>
      <p style="margin: 0; font-size: 13px; color: #5c7085;">請輸入集章卡上的序號（例如：XMAS101）</p>
      <div class="search-row">
        <input type="text" id="card-in" placeholder="例如：XMAS101" onkeydown="if(event.key==='Enter') checkCard()">
        <button id="search-btn" onclick="checkCard()">查詢進度</button>
      </div>
    </div>

    <div id="result-card" class="card hidden">
      <div class="top-bar">
        <div>
          <span style="font-size: 12px; font-weight: bold; color: #5c7085;">卡片編號</span>
          <div id="show-id" style="font-size: 24px; font-weight: 900; font-family: monospace;">XMAS101</div>
        </div>
        <div id="show-badge"></div>
      </div>

      <div class="prog-box">
        <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;">
          <span>⭐ 氣球兌換進度（5 選 4 達標）</span>
          <span id="prog-txt" style="color: #d94848;">0 / 4 項達標</span>
        </div>
        <div class="track"><div id="prog-bar" class="fill"></div></div>
      </div>

      <h3 style="margin: 0 0 12px; font-size: 16px;">⛄ 聖誕精靈五大任務小印章</h3>
      <div id="task-list"></div>
      <div id="sync-hint" class="sync-hint"></div>
    </div>
  </div>

  <div class="snow-scene" aria-hidden="true">
    <svg viewBox="0 0 1440 165" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,88 Q360,52 740,86 T1440,74 L1440,165 L0,165 Z" fill="#f7fafe" />
      <path d="M0,115 Q440,92 900,118 T1440,106 L1440,165 L0,165 Z" fill="#edf3fa" />
      <g transform="translate(275, 76)">
        <rect x="0" y="12" width="38" height="30" rx="5" fill="#d94848" stroke="#12365a" stroke-width="2.3" />
        <rect x="-3" y="7" width="44" height="9" rx="3.5" fill="#e85d5d" stroke="#12365a" stroke-width="2.3" />
        <line x1="19" y1="7" x2="19" y2="42" stroke="#f4b942" stroke-width="4.5" />
        <path d="M19,7 Q10,-3 7,2 Q5,7 19,7 Z" fill="#f4b942" stroke="#12365a" stroke-width="1.8" />
        <path d="M19,7 Q28,-3 31,2 Q33,7 19,7 Z" fill="#f4b942" stroke="#12365a" stroke-width="1.8" />
      </g>
      <g transform="translate(720, 4)">
        <rect x="-10" y="102" width="20" height="18" rx="3" fill="#8d5b3c" stroke="#12365a" stroke-width="2.2" />
        <path d="M0,50 L-48,104 L48,104 Z" fill="#2d7a5f" stroke="#12365a" stroke-width="2.6" stroke-linejoin="round" />
        <path d="M0,26 L-36,72 L36,72 Z" fill="#358d6e" stroke="#12365a" stroke-width="2.6" stroke-linejoin="round" />
        <path d="M0,7 L-24,44 L24,44 Z" fill="#3fa380" stroke="#12365a" stroke-width="2.6" stroke-linejoin="round" />
        <polygon points="0,-6 3.5,2.5 12.5,2.5 5,8 7.5,16.5 0,11.5 -7.5,16.5 -5,8 -12.5,2.5 -3.5,2.5" fill="#f4b942" stroke="#12365a" stroke-width="1.8" stroke-linejoin="round" />
        <circle cx="-14" cy="60" r="4.2" fill="#d94848" />
        <circle cx="13" cy="64" r="4.2" fill="#f4b942" />
        <circle cx="-21" cy="90" r="4.5" fill="#f4b942" />
        <circle cx="6" cy="85" r="4.2" fill="#d94848" />
        <circle cx="22" cy="92" r="4.2" fill="#fff" />
      </g>
      <g transform="translate(1060, 56)">
        <circle cx="0" cy="36" r="22" fill="#ffffff" stroke="#12365a" stroke-width="2.4" />
        <circle cx="0" cy="6" r="16" fill="#ffffff" stroke="#12365a" stroke-width="2.4" />
        <path d="M-14,-4 Q0,-21 14,-4 Z" fill="#d94848" stroke="#12365a" stroke-width="2.2" stroke-linejoin="round" />
        <circle cx="0" cy="-16" r="4" fill="#f4b942" stroke="#12365a" stroke-width="1.8" />
        <rect x="-12" y="18" width="24" height="5.5" rx="2.8" fill="#2d7a5f" stroke="#12365a" stroke-width="1.8" />
        <circle cx="-5" cy="4.5" r="1.9" fill="#12365a" />
        <circle cx="5.5" cy="4.5" r="1.9" fill="#12365a" />
        <circle cx="0.8" cy="8.5" r="2" fill="#e67e22" />
        <path d="M-4,11.5 Q0.8,14.8 5.5,11.5" fill="none" stroke="#12365a" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="0" cy="30" r="2" fill="#12365a" />
        <circle cx="0" cy="40" r="2" fill="#12365a" />
      </g>
      <g transform="translate(1122, 85)">
        <rect x="0" y="9" width="28" height="23" rx="4" fill="#2d7a5f" stroke="#12365a" stroke-width="2" />
        <rect x="-2" y="4" width="32" height="7" rx="2.5" fill="#3b9475" stroke="#12365a" stroke-width="2" />
        <line x1="14" y1="4" x2="14" y2="32" stroke="#d94848" stroke-width="3.5" />
      </g>
    </svg>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwor5xk2ceqsWai6lz68sfnjyoxGmZaC_RtPY1BFzX57QqrDu6sJsdylp2MheEJfhr9/exec';

    const TASKS = [
      { id: 't1', title: '1. 參加林老師或英語說故事活動', desc: '參加任意一場林老師或英語說故事活動', icon: '📖' },
      { id: 't2', title: '2. 參加 12/20 早上說故事活動', desc: '參與 12/20 上午場次特別說故事活動', icon: '🎄' },
      { id: 't3', title: '3. 借閱或尋找聖誕節電子書', desc: '借閱一本電子書或尋找聖誕節相關電子書（需出示畫面）', icon: '📱' },
      { id: 't4', title: '4. 於活動期間使用手機 APP 借書功能借閱 3 本書', desc: '於活動期間使用手機 APP 借書功能成功借閱 3 本書', icon: '📚' },
      { id: 't5', title: '5. 活動期間借書數量達 10 本', desc: '於活動期間累積借閱書籍達 10 本', icon: '🌟' }
    ];

    const TARGET_GOAL = 4;
    const TOTAL_TASKS = TASKS.length;

    function renderRecord(id, data, sourceText) {
      const validIds = TASKS.map(t => t.id);
      const doneList = (data.completed || []).filter(item => validIds.includes(item));

      document.getElementById('show-id').textContent = id;
      const count = doneList.length;
      document.getElementById('prog-txt').textContent = `${count} / ${TARGET_GOAL} 項達標（共 ${TOTAL_TASKS} 項）`;
      document.getElementById('prog-bar').style.width = `${Math.min((count / TARGET_GOAL) * 100, 100)}%`;

      const badge = document.getElementById('show-badge');
      if (data.claimed) badge.innerHTML = `<span class="pill claimed">🎈 已經拿到氣球囉！</span>`;
      else if (count >= TARGET_GOAL) badge.innerHTML = `<span class="pill ready">🎈 達標啦！快去找老師領氣球</span>`;
      else badge.innerHTML = `<span class="pill wait">❄️ 還差 ${TARGET_GOAL - count} 個就能換氣球</span>`;

      document.getElementById('task-list').innerHTML = TASKS.map(t => {
        const isDone = doneList.includes(t.id);
        return `
          <div class="task ${isDone ? 'done' : ''}">
            <div class="icon">${isDone ? '✓' : t.icon}</div>
            <div>
              <div style="font-weight: bold; font-size: 14px;">${t.title}</div>
              <div style="font-size: 12px; color: #5c7085; margin-top: 2px;">${t.desc}</div>
            </div>
          </div>`;
      }).join('');

      document.getElementById('sync-hint').textContent = sourceText;
      document.getElementById('result-card').classList.remove('hidden');
    }

    async function checkCard() {
      const id = document.getElementById('card-in').value.trim().toUpperCase();
      if (!id) return alert('請先輸入卡片編號喔！');

      const btn = document.getElementById('search-btn');
      btn.disabled = true;
      btn.textContent = '查詢中...';

      const db = JSON.parse(localStorage.getItem('lib_xmas_db')) || {};
      const localData = db[id] || { completed: [], claimed: false };

      if (GAS_URL && GAS_URL !== 'YOUR_GAS_WEB_APP_URL') {
        try {
          const res = await fetch(`${GAS_URL}?cardId=${encodeURIComponent(id)}`);
          const json = await res.json();
          if (json && json.ok && json.record) {
            db[id] = json.record;
            localStorage.setItem('lib_xmas_db', JSON.stringify(db));
            renderRecord(id, json.record, '已同步雲端最新集章紀錄');
            btn.disabled = false;
            btn.textContent = '查詢進度';
            return;
          }
        } catch (err) {
          // 網路不穩時改用本機快取顯示
        }
      }

      renderRecord(id, localData, '目前顯示本機紀錄');
      btn.disabled = false;
      btn.textContent = '查詢進度';
    }
  </script>
</body>
</html>
